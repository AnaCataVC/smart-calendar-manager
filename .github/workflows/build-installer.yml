name: Build and Upload Setup Installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the installer to'
        required: true
        default: 'v1.5.0'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name || 'main' }}

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Ensure Inno Setup is Installed
        shell: powershell
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup -y --no-progress
          }
          if (Test-Path $isccPath) {
            Write-Host "Inno Setup found at $isccPath"
            echo "ISCC_PATH=$isccPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Error "ISCC.exe not found after install"
            exit 1
          }

      - name: Compile and Publish win-x64
        shell: powershell
        run: |
          dotnet publish src\SmartCalendarManager.App\SmartCalendarManager.App.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o releases\SmartCalendarManager-win-x64

      - name: Compile Inno Setup Installer
        shell: powershell
        run: |
          & "$env:ISCC_PATH" installer.iss

      - name: Upload Installer Asset to Release
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $targetTag = "${{ github.event.inputs.tag || github.event.release.tag_name }}"
          if (-not $targetTag) { $targetTag = "v1.5.0" }
          
          $installer = Get-ChildItem -Path releases -Filter "SmartCalendarManager-Setup-*.exe" | Select-Object -First 1
          if ($installer) {
            Write-Host "Uploading $($installer.FullName) to release $targetTag..."
            gh release upload $targetTag $installer.FullName --clobber
            Write-Host "Upload successful!"
          } else {
            Write-Error "Installer executable not found in releases directory!"
            exit 1
          }

      - name: Verify Release Assets
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $targetTag = "${{ github.event.inputs.tag || github.event.release.tag_name }}"
          if (-not $targetTag) { $targetTag = "v1.5.0" }
          gh release view $targetTag --json assets
