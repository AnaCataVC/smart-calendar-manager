name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Test WinUI 3 App
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Unit Tests
        run: dotnet test tests/SmartCalendarManager.Tests/SmartCalendarManager.Tests.csproj -c Release

      - name: Verify App Compilation
        run: dotnet build src/SmartCalendarManager.App/SmartCalendarManager.App.csproj -c Release -p:Platform=x64
