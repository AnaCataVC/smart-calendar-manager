name: Release Installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish WinUI 3 Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run Unit Tests
        run: dotnet test tests/SmartCalendarManager.Tests/SmartCalendarManager.Tests.csproj -c Release

      - name: Publish WinUI 3 App (win-x64)
        run: |
          dotnet publish src/SmartCalendarManager.App/SmartCalendarManager.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -o releases/SmartCalendarManager-win-x64

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $isccPath = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $isccPath)) {
            Write-Error "Inno Setup compiler (ISCC.exe) not found on runner."
            exit 1
          }
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          & $isccPath /DMyAppVersion=$tagVersion installer.iss

      - name: Package Deliverables & Checksum
        shell: pwsh
        run: |
          $setupExe = Get-ChildItem -Path releases -Filter "SmartCalendarManager-Setup-*.exe" | Select-Object -First 1
          if (-not $setupExe) {
            Write-Error "Installer deliverable not found in releases/"
            exit 1
          }
          Write-Host "Found installer deliverable: $($setupExe.FullName)"
          Get-FileHash $setupExe.FullName -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Out-File -Encoding ascii "$($setupExe.FullName).sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/SmartCalendarManager-Setup-*.exe
            releases/SmartCalendarManager-Setup-*.exe.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
